# Streamlit configuration for better performance
[server]
# Reduce reruns by increasing file watcher timeout
fileWatcherType = "poll"
runOnSave = false

[browser]
# Disable automatic reruns on file changes
gatherUsageStats = false

[runner]
# Optimize rerun behavior
fastReruns = true
magicEnabled = false

[client]
# Show fewer errors in UI
showErrorDetails = true
toolbarMode = "minimal"

[theme]
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"
