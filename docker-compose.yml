version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"  # FastAPI backend
      - "5173:5173"  # React frontend dev server
    volumes:
      - .:/app
      - /app/frontend/node_modules  # Prevent overwriting node_modules
      - ./data:/app/data
      - ./results:/app/results
      - ./cache:/app/cache
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=8000
    command: >
      sh -c "python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.dev
      target: frontend-builder
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped
    depends_on:
      - app
